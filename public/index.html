<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Humble Hosting</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07080b;
    color:#fff;
    font-family:Inter,Arial,sans-serif;
}

.loader{
    text-align:center;
    animation:fadeIn .7s ease;
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 20px;

    display:grid;
    place-items:center;

    border-radius:20px;

    background:linear-gradient(
        135deg,
        #765cff,
        #28cfff
    );

    font-size:32px;
    font-weight:900;

    box-shadow:
        0 0 35px rgba(118,92,255,.35);
}

h1{
    font-size:25px;
    font-weight:800;
    margin-bottom:7px;
}

h1 span{
    color:#a99aff;
}

p{
    color:#8d95a5;
    font-size:13px;
}

.spinner{
    width:28px;
    height:28px;

    margin:25px auto 0;

    border:3px solid #222733;
    border-top-color:#765cff;

    border-radius:50%;

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="loader">

    <div class="logo">H</div>

    <h1>
        Humble<span>Hosting</span>
    </h1>

    <p>
        Preparing your hosting dashboard...
    </p>

    <div class="spinner"></div>

</div>

<script>
/*
    Humble Hosting entry page

    Automatically sends visitors
    to the registration page.
*/

setTimeout(() => {
    window.location.replace("register.html");
}, 1500);
</script>

</body>
</html>
